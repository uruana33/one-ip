  <script>
    // Classic ES5 script: IE cannot execute the application's module bundle.
    (function () {
      var root = document.documentElement;
      // Fallback only: production must also send frame-ancestors / X-Frame-Options.
      if (window.self !== window.top) {
        root.className = "embedded-browser";
        return;
      }
      if (document.documentMode || /MSIE|Trident/.test(navigator.userAgent)) {
        root.className = "unsupported-browser";
        return;
      }
      try {
        var stored = localStorage.getItem("theme");
        var theme = "paper";
        if (stored === "light") theme = "paper";
        else if (stored === "dark") theme = "ink";
        else if (
          stored === "paper" ||
          stored === "ink" ||
          stored === "parchment" ||
          stored === "chart" ||
          stored === "ember"
        )
          theme = stored;
        else
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "ink"
            : "paper";
        var dark = theme === "ink" || theme === "ember";
        root.setAttribute("data-theme", theme);
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        ["color", "radius", "layout", "font-size"].forEach(function (key) {
          var value = localStorage.getItem("ui-" + key);
          if (value && value !== "default") root.setAttribute("data-" + key, value);
        });
      } catch (error) {
        // Keep the page usable when browser storage is unavailable.
      }
    })();
  </script>
