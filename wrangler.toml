name = "one-ip"
main = "public/worker/index.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/api/*",
  "/assets/*",
  "/worker",
  "/worker/*",
  "/network/*",
  "/webrtc",
  "/webrtc/*",
  "/ai",
  "/ai/*",
  "/status",
  "/status/*",
  "/docs/*",
  "/whois",
  "/ping",
  "/dns",
  "/share",
  "/r",
  "/r/*",
  "/og.png",
]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
# 10% of requests, including invocation logs. Workers Logs includes 200k events/day
# on the Free plan and 20M/month on Paid, then $0.60 per extra million.
invocation_logs = true

[observability.traces]
enabled = false

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Local development forwards all page and asset requests to Vite.
[env.local.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.local.ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[env.local.ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Share snapshots (about 30 days). Create the namespace, then replace the id:
#   pnpm exec wrangler kv namespace create REPORTS
# Dashboard: Workers & Pages → KV → Create → bind as REPORTS on the one-ip Worker.
# A missing binding makes /api/report and /r/{id} return 503; other routes stay up.
# `wrangler deploy` fails if this id is not a namespace on the account — replace it first.
[[kv_namespaces]]
binding = "REPORTS"
id = "3b90e777202347f4ab761db59504ca3b"

[[env.local.kv_namespaces]]
binding = "REPORTS"
id = "3b90e777202347f4ab761db59504ca3b"
